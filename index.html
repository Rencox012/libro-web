<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudio de Arquitectura — Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <!-- Clase embed aplicada ANTES del primer layout/paint,
       para que los estilos de modo embed (alturas absolutas)
       estén activos cuando el libro se renderice. -->
  <script>
    if (location.search.indexOf("embed") !== -1 ||
        location.hash.indexOf("embed") !== -1) {
      document.documentElement.classList.add("embed");
    }
  </script>

  <link rel="stylesheet" href="css/estilos.css" />
</head>
<!-- (body sin clase; el script inline del <head> ya marcó html.embed) -->
<body>

  <header class="marca">
    <span class="marca-linea"></span>
    <span class="marca-texto">Estudio de Arquitectura</span>
    <span class="marca-linea"></span>
  </header>

  <main class="escenario">
    <div class="libro" id="libro" aria-live="polite">
      <!-- Página izquierda -->
      <section class="pagina pagina-izq" id="paginaIzq"></section>
      <!-- Lomo -->
      <div class="lomo" aria-hidden="true"></div>
      <!-- Página derecha -->
      <section class="pagina pagina-der" id="paginaDer"></section>
      <!-- Página giratoria (efecto de pasar página) -->
      <div class="giratoria" id="giratoria" aria-hidden="true">
        <div class="giratoria-cara giratoria-frente" id="girFrente"></div>
        <div class="giratoria-cara giratoria-atras" id="girAtras"></div>
      </div>
      <!-- Botones en los bordes (visibles en modo embed) -->
      <button class="btn btn-borde borde-anterior" id="btnAnterior" aria-label="Página anterior">&#8249;</button>
      <button class="btn btn-borde borde-siguiente" id="btnSiguiente" aria-label="Página siguiente">&#8250;</button>
    </div>
  </main>

  <nav class="controles" aria-label="Navegación del libro">
    <button class="btn nav-anterior" id="btnAnteriorNormal" aria-label="Página anterior">&#8249;</button>
    <span class="indicador" id="indicador"></span>
    <button class="btn nav-siguiente" id="btnSiguienteNormal" aria-label="Página siguiente">&#8250;</button>
  </nav>

  <footer class="pie">
    <p>&copy; 2026 — Todos los proyectos son obra del estudio.</p>
  </footer>

  <!-- ---------- Modo embed ----------
       La clase embed la setea el script inline del <head> (en <html>),
       antes del CSS y del primer paint. Este script de libro.js
       también la replica en <body> como respaldo por si aquel
       no llegó a correr. -->
  <script src="js/datos.js"></script>
  <script src="js/libro.js"></script>
</body>
</html>
